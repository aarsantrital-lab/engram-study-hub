<!DOCTYPE html>
<html lang="en" data-theme="dark" class="is-booting">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is required for the safe-area insets the app bar and the
     bottom tab bar rely on (build-constraints §9.5). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d12">
<meta name="description" content="Engram — the study hub: spaced review, mind maps, numericals and past papers for NEB Grade 11.">
<title>Engram · Study Hub</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Engram">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<!-- Stylesheets — ZERO external origins (no CDN, no web fonts; system stack).
     Order is load-bearing:
       theme.css          design tokens  (design job)
       css/shell.css      shell structure only, token-driven (app-shell job)
       css/components.css component vocabulary (design job) — loads last so it
                          always wins where the two overlap. -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<a class="skip-link" href="#view-root">Skip to content</a>

<div class="app-shell">

  <!-- ===== Left sidebar (desktop ≥768px) ================================ -->
  <aside class="sidebar" id="sidebar">
    <a class="sidebar__brand" href="#/home">
      <span class="sidebar__brand-mark" aria-hidden="true">E</span>
      <span class="sidebar__brand-text">
        <span class="sidebar__brand-name">Engram</span>
        <span class="sidebar__brand-sub">Class 11 · NEB</span>
      </span>
    </a>
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Main"></nav>
    <div class="sidebar__foot" id="sidebar-foot"></div>
  </aside>

  <!-- ===== Main column ================================================== -->
  <div class="app-col">

    <header class="appbar" id="appbar">
      <a class="icon-tile icon-tile--sm icon-tile--brand appbar__logo" id="logo-tile" href="#/home" aria-label="Engram home">E</a>
      <h1 class="appbar__title" id="appbar-title">Engram</h1>
      <div class="appbar__spacer"></div>

      <button class="chip chip--button streak" id="streak-flame" type="button" data-state="cold" aria-label="Study streak">
        <svg class="icon icon--14 streak__flame" viewBox="0 0 24 24" aria-hidden="true"><use href="#flame"></use></svg>
        <span class="streak__count tabular" id="streak-count">0</span>
      </button>

      <button class="chip chip--button appbar__search" id="btn-search" type="button" aria-label="Search (Ctrl K)">
        <svg class="icon icon--14" viewBox="0 0 24 24" aria-hidden="true"><use href="#search"></use></svg>
        <span class="appbar__search-label">Search</span>
        <kbd class="kbd appbar__kbd">Ctrl K</kbd>
      </button>
    </header>

    <div class="banners" id="banners" role="region" aria-label="Notices"></div>

    <main class="app-main">
      <div class="app-content" id="view-root" tabindex="-1">
        <div class="boot">
          <div class="boot__mark">E</div>
          <p class="boot__text">Loading your study hub…</p>
        </div>
      </div>
    </main>

    <noscript>
      <div class="noscript">
        <h1>Engram needs JavaScript</h1>
        <p>This hub runs entirely in your browser — no server, no tracking. Enable JavaScript and reload.</p>
      </div>
    </noscript>
  </div>

  <!-- ===== Bottom tab bar (mobile <768px) =============================== -->
  <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
</div>

<!-- ===== "More" bottom sheet (scrim + sheet are injected by app.js) ===== -->
<div class="sheet-layer" id="more-sheet" hidden></div>

<!-- =======================================================================
     Load order is load-bearing (build-constraints §2):
       1. vault-data.js  — CLASSIC script, sets window.VAULT_DATA.
                           IT IS ALLOWED TO BE MISSING: the shell must still
                           boot to a friendly empty state. Do not "fix" the
                           404 by deleting this tag.
       2. js/app.js      — ES module (deferred by spec, so it always runs
                           after the classic script above).
     ==================================================================== -->
<script src="vault-data.js" onerror="window.__VAULT_MISSING__=true"></script>
<script type="module" src="js/app.js"></script>

<!-- ===== Boot watchdog ==================================================
     app.js installs its global error handlers INSIDE boot(), so a module
     that fails to fetch or parse takes the whole ES-module graph down
     before any handler exists: nothing removes .is-booting, .boot is only
     ever hidden by .is-ready, and the student sits on "Loading your study
     hub…" forever with no way to know why. This is a classic script, so it
     runs even when the module graph never instantiates. It only ever
     replaces the boot placeholder — if the app came up, it does nothing.
     ==================================================================== -->
<script>
(function () {
  var BOOT_TIMEOUT_MS = 8000;
  function failed(reason) {
    var root = document.documentElement;
    if (root.classList.contains('is-ready')) return;
    var host = document.querySelector('.boot');
    if (!host || host.dataset.failed) return;
    host.dataset.failed = '1';
    root.classList.remove('is-booting');
    host.textContent = '';
    var mark = document.createElement('div');
    mark.className = 'boot__mark';
    mark.textContent = '!';
    var head = document.createElement('p');
    head.className = 'boot__text';
    head.textContent = 'The hub could not start.';
    var body = document.createElement('p');
    body.className = 'boot__text';
    body.style.maxWidth = '34ch';
    body.textContent = reason + ' Reload the page; if it keeps happening, your saved '
      + 'progress is still safe in this browser.';
    var again = document.createElement('button');
    again.type = 'button';
    again.className = 'btn btn-primary';
    again.textContent = 'Reload';
    again.onclick = function () { location.reload(); };
    host.appendChild(mark); host.appendChild(head); host.appendChild(body); host.appendChild(again);
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window && e.target.tagName === 'SCRIPT') {
      failed('A file it needs did not load.');
    }
  }, true);
  setTimeout(function () { failed('It timed out while loading.'); }, BOOT_TIMEOUT_MS);
})();
</script>

</body>
</html>
