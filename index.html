<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<title>Engram · Study Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>◈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:ital,wght@0,300..800;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot" class="boot"><div class="boot-mark">◈</div><div class="boot-text">loading vault…</div></div>

<div id="app" hidden>

  <aside class="rail" id="rail">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-name">Engram</span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item" data-view="today"><span class="nav-ico">▣</span><span>Today</span><span class="nav-badge" id="navDue"></span></button>
      <button class="nav-item" data-view="study"><span class="nav-ico">◐</span><span>Study</span></button>
      <button class="nav-item" data-view="topics"><span class="nav-ico">≡</span><span>Topics</span></button>
      <button class="nav-item" data-view="map"><span class="nav-ico">✳</span><span>Mind map</span></button>
      <button class="nav-item" data-view="stats"><span class="nav-ico">▤</span><span>Stats</span></button>
    </nav>

    <div class="rail-section">
      <div class="rail-label">Subjects</div>
      <div id="subjectFilters" class="chips"></div>
    </div>

    <div class="rail-foot">
      <button class="ghost-btn" id="themeBtn" title="Toggle theme (T)">◑ Theme</button>
      <button class="ghost-btn" id="settingsBtn" title="Settings">⚙ Settings</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="rail-toggle" id="railToggle" aria-label="Menu">☰</button>
      <button class="search-trigger" id="searchTrigger">
        <span class="s-ico">⌕</span>
        <span class="s-text">Search cards, notes, topics…</span>
        <kbd>⌘K</kbd>
      </button>
      <div class="meters">
        <div class="meter" title="Cards due now"><span class="meter-v" id="mDue">0</span><span class="meter-l">due</span></div>
        <div class="meter" title="Consecutive study days"><span class="meter-v" id="mStreak">0</span><span class="meter-l">streak</span></div>
        <div class="meter" title="Rolling retention"><span class="meter-v" id="mRet">—</span><span class="meter-l">recall</span></div>
      </div>
    </header>

    <div class="scroller" id="scroller">
      <section class="view" id="view-today"></section>
      <section class="view" id="view-study" hidden></section>
      <section class="view" id="view-topics" hidden></section>
      <section class="view" id="view-map" hidden></section>
      <section class="view" id="view-stats" hidden></section>
    </div>
  </main>
</div>

<!-- command palette / global search -->
<div class="overlay" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
    <div class="palette-input-row">
      <span class="s-ico">⌕</span>
      <input id="paletteInput" type="text" placeholder="Search everything, or type a command…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div class="palette-results" id="paletteResults"></div>
    <div class="palette-foot"><kbd>↑↓</kbd> navigate <kbd>↵</kbd> open <kbd>tab</kbd> filter</div>
  </div>
</div>

<!-- generic modal -->
<div class="overlay" id="modal" hidden>
  <div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<!-- lightbox -->
<div class="overlay lightbox" id="lightbox" hidden>
  <img id="lightboxImg" alt="">
  <div class="lightbox-cap" id="lightboxCap"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="vault-data.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
<script src="js/store.js"></script>
<script src="js/srs.js"></script>
<script src="js/md.js"></script>
<script src="js/mindmap.js"></script>
<script src="js/app.js"></script>
</body>
</html>
